<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Minimal iconic logo - Shield + No Bug + Check -->
  
  <!-- Accent color circle background -->
  <circle cx="100" cy="100" r="95" fill="#4A7C6F"/>
  
  <!-- White shield -->
  <path d="M100 20 L160 45 L160 95 C160 135 132 168 100 185 C68 168 40 135 40 95 L40 45 Z" 
        fill="#FFFFFF"/>
  
  <!-- Simplified bed bug icon -->
  <g transform="translate(100, 85)">
    <!-- Main body - single smooth shape -->
    <path d="M0 -28 
             C8 -28 14 -24 14 -18
             C18 -16 22 -10 22 0
             C22 18 14 32 0 32
             C-14 32 -22 18 -22 0
             C-22 -10 -18 -16 -14 -18
             C-14 -24 -8 -28 0 -28Z" 
          fill="#2D3436"/>
    
    <!-- Legs -->
    <g stroke="#2D3436" stroke-width="3" stroke-linecap="round">
      <line x1="-18" y1="-6" x2="-30" y2="-14"/>
      <line x1="18" y1="-6" x2="30" y2="-14"/>
      <line x1="-20" y1="8" x2="-34" y2="6"/>
      <line x1="20" y1="8" x2="34" y2="6"/>
      <line x1="-16" y1="22" x2="-28" y2="32"/>
      <line x1="16" y1="22" x2="28" y2="32"/>
    </g>
  </g>
  
  <!-- Red prohibition - bold and clear -->
  <circle cx="100" cy="85" r="48" fill="none" stroke="#DC2626" stroke-width="6"/>
  <line x1="66" y1="51" x2="134" y2="119" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Green checkmark - SOLVED -->
  <path d="M72 155 L88 171 L128 131" 
        fill="none" 
        stroke="#4A7C6F" 
        stroke-width="8" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>