<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="3" dy="3" stdDeviation="4" flood-color="#C8CCD0" flood-opacity="0.8"/>
    </filter>
  </defs>
  
  <!-- Clean circle background -->
  <circle cx="100" cy="100" r="92" fill="#4A7C6F"/>
  
  <!-- Inner light ring -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#5A9080" stroke-width="2" opacity="0.5"/>
  
  <!-- Shield outline - protection -->
  <path d="M100 28 L152 50 L152 92 C152 128 128 158 100 175 C72 158 48 128 48 92 L48 50 Z" 
        fill="#E8ECEF"
        filter="url(#shadow)"/>
  
  <!-- Bed bug - stylized, simple -->
  <g transform="translate(100, 88)">
    <!-- Body -->
    <ellipse cx="0" cy="8" rx="20" ry="26" fill="#2D3436"/>
    <!-- Head -->
    <ellipse cx="0" cy="-18" rx="11" ry="9" fill="#2D3436"/>
    
    <!-- Body ridges -->
    <path d="M-16 0 Q0 6 16 0" fill="none" stroke="#E8ECEF" stroke-width="1.5" opacity="0.3"/>
    <path d="M-18 10 Q0 16 18 10" fill="none" stroke="#E8ECEF" stroke-width="1.5" opacity="0.3"/>
    <path d="M-16 20 Q0 26 16 20" fill="none" stroke="#E8ECEF" stroke-width="1.5" opacity="0.3"/>
    
    <!-- Legs - simplified -->
    <g stroke="#2D3436" stroke-width="2.5" stroke-linecap="round">
      <line x1="-16" y1="-8" x2="-26" y2="-16"/>
      <line x1="16" y1="-8" x2="26" y2="-16"/>
      <line x1="-18" y1="6" x2="-30" y2="4"/>
      <line x1="18" y1="6" x2="30" y2="4"/>
      <line x1="-16" y1="20" x2="-26" y2="28"/>
      <line x1="16" y1="20" x2="26" y2="28"/>
    </g>
  </g>
  
  <!-- Red prohibition symbol -->
  <g stroke="#E53E3E" stroke-width="5" fill="none">
    <circle cx="100" cy="90" r="42"/>
    <line x1="70" y1="60" x2="130" y2="120" stroke-linecap="round"/>
  </g>
  
  <!-- Green checkmark below - SOLVED -->
  <path d="M78 148 L92 162 L122 132" 
        fill="none" 
        stroke="#4A7C6F" 
        stroke-width="7" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
  
  <!-- Small accent dot -->
  <circle cx="100" cy="148" r="3" fill="#4A7C6F" opacity="0"/>
</svg>