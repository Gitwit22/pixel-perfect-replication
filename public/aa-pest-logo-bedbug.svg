<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <!-- Neumorphic shadow filter -->
    <filter id="neuShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="4" stdDeviation="6" flood-color="#C8CCD0" flood-opacity="1"/>
      <feDropShadow dx="-4" dy="-4" stdDeviation="6" flood-color="#FFFFFF" flood-opacity="1"/>
    </filter>
    
    <!-- Inner shadow for depth -->
    <filter id="innerShadow">
      <feOffset dx="2" dy="2"/>
      <feGaussianBlur stdDeviation="2" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="#3A6C5F" flood-opacity="0.4" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>
  
  <!-- Background circle - neumorphic style -->
  <circle cx="100" cy="100" r="90" fill="#E8ECEF" filter="url(#neuShadow)"/>
  
  <!-- Inner accent circle -->
  <circle cx="100" cy="100" r="75" fill="#4A7C6F"/>
  
  <!-- Shield shape - protection symbol -->
  <path d="M100 35 L145 55 L145 95 C145 125 125 150 100 165 C75 150 55 125 55 95 L55 55 Z" 
        fill="#E8ECEF" 
        filter="url(#innerShadow)"/>
  
  <!-- Stylized bed bug silhouette with prohibition -->
  <g transform="translate(100, 95)">
    <!-- Simple bed bug body - oval shapes -->
    <ellipse cx="0" cy="0" rx="22" ry="28" fill="#2D3436" opacity="0.85"/>
    <ellipse cx="0" cy="-20" rx="12" ry="10" fill="#2D3436" opacity="0.85"/>
    
    <!-- Bug segments -->
    <ellipse cx="0" cy="5" rx="18" ry="8" fill="#3d4446" opacity="0.6"/>
    <ellipse cx="0" cy="-5" rx="16" ry="6" fill="#3d4446" opacity="0.4"/>
    
    <!-- Small legs suggestion -->
    <line x1="-18" y1="-10" x2="-25" y2="-18" stroke="#2D3436" stroke-width="3" stroke-linecap="round"/>
    <line x1="18" y1="-10" x2="25" y2="-18" stroke="#2D3436" stroke-width="3" stroke-linecap="round"/>
    <line x1="-20" y1="5" x2="-28" y2="2" stroke="#2D3436" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="5" x2="28" y2="2" stroke="#2D3436" stroke-width="3" stroke-linecap="round"/>
    <line x1="-18" y1="18" x2="-26" y2="24" stroke="#2D3436" stroke-width="3" stroke-linecap="round"/>
    <line x1="18" y1="18" x2="26" y2="24" stroke="#2D3436" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- Prohibition circle/slash - "No bugs" -->
  <circle cx="100" cy="95" r="38" fill="none" stroke="#dc2626" stroke-width="6" opacity="0.95"/>
  <line x1="73" y1="68" x2="127" y2="122" stroke="#dc2626" stroke-width="6" stroke-linecap="round" opacity="0.95"/>
  
  <!-- Checkmark at bottom of shield - problem solved -->
  <path d="M82 140 L95 153 L120 128" 
        fill="none" 
        stroke="#4A7C6F" 
        stroke-width="6" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>