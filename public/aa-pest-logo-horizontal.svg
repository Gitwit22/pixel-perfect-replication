<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;display=swap');
    </style>
  </defs>
  
  <!-- Icon - scaled down -->
  <g transform="translate(50, 50) scale(0.45)">
    <!-- Accent circle -->
    <circle cx="0" cy="0" r="95" fill="#4A7C6F"/>
    
    <!-- White shield -->
    <path d="M0 -80 L60 -55 L60 -5 C60 35 32 68 0 85 C-32 68 -60 35 -60 -5 L-60 -55 Z" 
          fill="#FFFFFF"/>
    
    <!-- Bug silhouette -->
    <g transform="translate(0, -15)">
      <path d="M0 -28 C8 -28 14 -24 14 -18 C18 -16 22 -10 22 0 C22 18 14 32 0 32 C-14 32 -22 18 -22 0 C-22 -10 -18 -16 -14 -18 C-14 -24 -8 -28 0 -28Z" fill="#2D3436"/>
      <g stroke="#2D3436" stroke-width="3" stroke-linecap="round">
        <line x1="-18" y1="-6" x2="-30" y2="-14"/>
        <line x1="18" y1="-6" x2="30" y2="-14"/>
        <line x1="-20" y1="8" x2="-34" y2="6"/>
        <line x1="20" y1="8" x2="34" y2="6"/>
        <line x1="-16" y1="22" x2="-28" y2="32"/>
        <line x1="16" y1="22" x2="28" y2="32"/>
      </g>
    </g>
    
    <!-- Prohibition -->
    <circle cx="0" cy="-15" r="48" fill="none" stroke="#DC2626" stroke-width="6"/>
    <line x1="-34" y1="-49" x2="34" y2="19" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Checkmark -->
    <path d="M-28 55 L-12 71 L28 31" fill="none" stroke="#4A7C6F" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Company Name -->
  <text x="115" y="42" font-family="Poppins, Arial, sans-serif" font-size="24" font-weight="700" fill="#2D3436">
    All-American
  </text>
  <text x="115" y="68" font-family="Poppins, Arial, sans-serif" font-size="16" font-weight="600" fill="#636E72">
    Pest Control
  </text>
  
  <!-- Accent underline -->
  <rect x="115" y="75" width="60" height="3" rx="1.5" fill="#4A7C6F"/>
</svg>